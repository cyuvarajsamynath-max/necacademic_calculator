<!DOCTYPE html>
<html>
<head>
    <title>Profile Page</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            background: #f4f4f4;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: #2c3e50;
            color: white;
            height: 100vh;
            padding: 20px;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            padding: 15px;
            cursor: pointer;
        }

        .sidebar ul li:hover {
            background: #34495e;
        }

        /* Main Content */
        .main {
            flex: 1;
            padding: 30px;
        }

        .main h1 {
            margin-bottom: 20px;
        }

        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            width: 400px;
        }

        .profile-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            display: block;
            margin: 0 auto 20px auto;
        }

        .profile-card h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .profile-card p {
            margin: 8px 0;
            font-size: 16px;
        }

        button {
            display: block;
            margin: 20px auto 0 auto;
            padding: 10px 20px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 25px;
            cursor: pointer;
        }

        button:hover {
            background: #764ba2;
        }

    </style>
</head>
<body>

    <div class="sidebar">
        <h2>My App</h2>
        <ul>
            <li>Home</li>
            <li>Profile</li>
            <li>Settings</li>
            <li>Contact</li>
        </ul>
    </div>

    <div class="main">
        <h1>My Profile</h1>

        <div class="profile-card">
            <img src="profile-pic.jpg" alt="Profile Picture">
            <h2>John Doe</h2>
            <p><strong>Email:</strong> john.doe@example.com</p>
            <p><strong>Phone:</strong> +1 234 567 890</p>
            <p><strong>Address:</strong> 123 Main Street, City, Country</p>
            <p><strong>About Me:</strong> I am a web developer learning HTML, CSS, and JavaScript.</p>

            <button>Edit Profile</button>
        </div>
    </div>

</body>
</html>
